name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache: true

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Vet
        working-directory: control-plane
        run: go vet ./...

      # go test runs the UI module-graph check (ui_check_test.go), which
      # bundles the pages' inline module scripts via esbuild and fails on any
      # missing export or unresolved specifier.
      - name: Test
        working-directory: control-plane
        run: go test ./...

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache: true

      - name: Build binary
        run: |
          cd control-plane
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/r-chat-helper ./cmd/r-chat-helper

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/r-chat-helper
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}