<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R Tutor</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --text:#e6e8ee; --muted:#8a93a5; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; }
  button, .signin-btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; text-decoration:none; text-align:center; }
  button.secondary { background:var(--panel); border:1px solid var(--border); }
  input, textarea { background:#0c0e12; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:14px; font-family:inherit; }
  .screen { display:none; height:100%; }
  .screen.active { display:flex; }
  #login { align-items:center; justify-content:center; }
  #login .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:28px; width:340px; }
  #login h1 { font-size:18px; margin:0 0 4px; }
  #login p { color:var(--muted); margin:0 0 16px; }
  #main { flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border); background:var(--panel); }
  header .name { font-weight:600; }
  header .meta { color:var(--muted); font-size:13px; flex:1; }
  #body { display:flex; flex:1; min-height:0; }
  #sidebar { width:280px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--panel); }
  #sidebar .actions { padding:12px; display:flex; gap:8px; }
  #sessions { overflow-y:auto; flex:1; }
  .session { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .session:hover { background:#1d212b; }
  .session .t { font-weight:500; }
  .session .m { color:var(--muted); font-size:12px; }
  #chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  #messages { flex:1; overflow-y:auto; padding:18px; }
  .msg { max-width:760px; margin:0 auto 14px; }
  .msg .role { font-size:12px; color:var(--muted); margin-bottom:3px; }
  .msg .bubble { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; word-wrap:break-word; }
  .msg.user .bubble { background:#20304f; border-color:#2c4470; white-space:pre-wrap; }
  .msg .bubble > :first-child { margin-top:0; }
  .msg .bubble > :last-child { margin-bottom:0; }
  .msg .bubble pre { background:#0c0e12; border:1px solid var(--border); border-radius:8px; padding:10px; overflow-x:auto; margin:8px 0; }
  .msg .bubble pre code { background:none; padding:0; border:none; }
  .msg .bubble code { background:#0c0e12; border:1px solid var(--border); border-radius:4px; padding:1px 4px; font-size:13px; }
  .msg .bubble .code-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:8px 0 4px; }
  .msg .bubble table { border-collapse:collapse; margin:8px 0; }
  .msg .bubble th, .msg .bubble td { border:1px solid var(--border); padding:4px 8px; }
  .msg .cost { font-size:12px; color:var(--muted); margin-top:4px; }
  #compose { display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--border); background:var(--panel); }
  #compose textarea { flex:1; resize:none; min-height:44px; }
  #notice { color:var(--muted); text-align:center; padding:18px; }
  #restore { display:none; color:var(--muted); font-size:13px; text-align:center; padding:8px 18px; background:var(--panel); border-bottom:1px solid var(--border); }
  .error { color:#ff6b6b; }
  .session { display:flex; align-items:center; gap:6px; }
  .session .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .session .menu-btn { background:none; border:none; color:var(--muted); font-size:15px; padding:2px 6px; cursor:pointer; }
  .session .menu-btn:hover { color:var(--text); }
  .menu-pop { position:absolute; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:4px; box-shadow:0 4px 16px rgba(0,0,0,.35); z-index:20; }
  .menu-pop button { display:block; background:none; border:none; color:var(--text); font-size:13px; padding:6px 12px; border-radius:6px; text-align:left; width:100%; cursor:pointer; }
  .menu-pop button:hover { background:#1d212b; }
  .menu-pop button.danger { color:#ff6b6b; }
</style>
</head>
<body>
  <div id="login" class="screen">
    <div class="card">
      <h1>R Tutor</h1>
      <p>Class AI R tutor. Sign in with your college email to continue.</p>
      <a class="signin-btn" href="/auth/login">Sign in</a>
    </div>
  </div>

  <div id="main" class="screen">
    <header>
      <span class="name" id="meName"></span>
      <span class="meta" id="meMeta"></span>
      <button class="secondary" id="logout">Log out</button>
    </header>
    <div id="restore"></div>
    <div id="body">
      <div id="sidebar">
        <div class="actions">
          <button id="newSession">New conversation</button>
        </div>
        <div id="sessions"></div>
      </div>
      <div id="chat">
        <div id="messages"><div id="notice">Select a conversation, or start a new one.</div></div>
        <div id="compose">
          <textarea id="prompt" placeholder="Ask about R, paste some code…"></textarea>
          <button id="send">Send</button>
        </div>
      </div>
    </div>
  </div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const api = {
  async req(path, opts={}) {
    opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
    const r = await fetch(path, opts);
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  }
};

let currentSession = null;

function fmtUsd(v) { return "$" + (v||0).toFixed(4); }
function esc(s) {
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

function closeMenus() {
  document.querySelectorAll(".menu-pop").forEach(m => m.remove());
}
document.addEventListener("click", closeMenus);

function showMain(s) {
  $("#login").classList.remove("active");
  $("#main").classList.add("active");
  $("#meName").textContent = s.name;
}

async function refreshMe() {
  const me = await api.req("/api/me");
  $("#meMeta").textContent = "spent " + fmtUsd(me.spent_usd) +
    (me.budget_usd > 0 ? " of " + fmtUsd(me.budget_usd) : "");
}

async function renameSession(id) {
  const el = document.querySelector(`[data-sid="${id}"] .t`);
  const old = el.textContent;
  const input = document.createElement("input");
  input.value = old; input.style.flex = "1"; input.style.minWidth = "0";
  el.replaceWith(input);
  input.focus(); input.select();
  const commit = async (cancel) => {
    const title = input.value.trim();
    if (!cancel && title && title !== old) {
      await api.req(`/api/me/sessions/${id}`, { method: "PATCH", body: JSON.stringify({ title }) });
      loadSessions();
    } else {
      input.replaceWith(el);
    }
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") commit(false);
    else if (e.key === "Escape") commit(true);
  });
  input.addEventListener("blur", () => commit(false));
}

async function deleteSession(id) {
  if (!confirm("Hide this conversation? It will no longer appear in your list.")) return;
  await api.req(`/api/me/sessions/${id}`, { method: "DELETE" });
  loadSessions();
  if (currentSession === id) {
    currentSession = null;
    $("#messages").innerHTML = `<div id="notice">Select a conversation, or start a new one.</div>`;
  }
}

function sessionMenuBtn(id, ev) {
  ev.stopPropagation();
  closeMenus();
  const rect = ev.currentTarget.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "menu-pop";
  pop.style.left = rect.left + "px";
  pop.style.top = (rect.bottom + 4) + "px";
  const ren = document.createElement("button"); ren.textContent = "Rename"; ren.onclick = () => { closeMenus(); renameSession(id); };
  const del = document.createElement("button"); del.textContent = "Delete"; del.className = "danger"; del.onclick = () => { closeMenus(); deleteSession(id); };
  pop.append(ren, del);
  document.body.appendChild(pop);
}

async function loadSessions() {
  const list = await api.req("/api/me/sessions");
  $("#sessions").innerHTML = "";
  for (const s of list) {
    const el = document.createElement("div");
    el.className = "session";
    el.dataset.sid = s.id;
    el.innerHTML = `<div class="t">${esc(s.title || "(untitled)")}</div>
      <div class="m">${fmtUsd(s.cost_usd)}</div>
      <button class="menu-btn" title="More">⋯</button>`;
    el.onclick = () => openSession(s.id);
    el.querySelector(".menu-btn").onclick = (ev) => sessionMenuBtn(s.id, ev);
    $("#sessions").appendChild(el);
  }
  closeMenus();
  return list;
}

async function ensureSession() {
  if (currentSession) return currentSession;
  const r = await api.req("/api/me/sessions", { method: "POST", body: JSON.stringify({}) });
  currentSession = r.id;
  return currentSession;
}

async function openSession(id) {
  currentSession = id;
  $("#restore").style.display = "none";
  const msgs = await api.req(`/api/me/sessions/${id}/messages`);
  $("#messages").innerHTML = "";
  if (!msgs.length) $("#messages").innerHTML = `<div id="notice">This is the start of a conversation.</div>`;
  for (const m of msgs) {
    const el = document.createElement("div");
    el.className = "msg " + m.role;
    if (m.role === "assistant") {
      el.innerHTML = `<div class="role">${esc(m.role)}</div><div class="bubble">${m.html || esc(m.text)}</div>`;
    } else {
      el.innerHTML = `<div class="role">${esc(m.role)}</div><div class="bubble">${esc(m.text)}</div>`;
    }
    $("#messages").appendChild(el);
  }
  $("#messages").scrollTop = $("#messages").scrollHeight;
}

async function send() {
  const text = $("#prompt").value.trim();
  if (!text) return;
  $("#prompt").value = "";
  const sid = await ensureSession();
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="role">you</div><div class="bubble">${esc(text)}</div>`;
  $("#messages").appendChild(el);
  const thinking = document.createElement("div");
  thinking.className = "msg assistant";
  thinking.innerHTML = `<div class="role">assistant</div><div class="bubble">…</div>`;
  $("#messages").appendChild(thinking);
  $("#messages").scrollTop = $("#messages").scrollHeight;

  try {
    const r = await api.req(`/api/me/sessions/${sid}/messages`, {
      method: "POST", body: JSON.stringify({ text })
    });
    thinking.innerHTML = `<div class="role">assistant</div><div class="bubble">${r.html || esc(r.assistant)}</div>
      <div class="cost">this turn: ${fmtUsd(r.cost_usd)} · total: ${fmtUsd(r.spent_usd)}</div>`;
    refreshMe();
    loadSessions();
  } catch (e) {
    thinking.innerHTML = `<div class="role">assistant</div><div class="bubble error">${esc(e.message)}</div>`;
  }
  $("#messages").scrollTop = $("#messages").scrollHeight;
}

$("#logout").onclick = () => { location.href = "/logout"; };
$("#newSession").onclick = async () => {
  const r = await api.req("/api/me/sessions", { method: "POST", body: JSON.stringify({}) });
  openSession(r.id); loadSessions();
};
$("#send").onclick = send;
$("#prompt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

(async () => {
  try {
    const me = await api.req("/api/me");
    if (me.role === "admin") {
      $("#login").classList.remove("active");
      $("#main").classList.add("active");
      $("#meName").textContent = me.email;
      $("#meMeta").textContent = "instructor";
      $("#newSession").style.display = "none";
      $("#compose").style.display = "none";
      $("#sessions").innerHTML = `<div id="notice">Admin tools are coming soon. Manage students, budgets, and usage from the CLI for now.</div>`;
      return;
    }
    showMain({ name: me.name, spent_usd: me.spent_usd });
    refreshMe();
    loadSessions();
    const cur = await api.req("/api/me/sessions/current");
    await openSession(cur.id);
    if (cur.restored) {
      const banner = $("#restore");
      banner.textContent = "Restored your last session. Click “New conversation” to start a new topic.";
      banner.style.display = "block";
    }
  } catch (e) {
    $("#login").classList.add("active");
  }
})();
</script>
</body>
</html>
