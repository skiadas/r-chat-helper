<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R Tutor</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --text:#e6e8ee; --muted:#8a93a5; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; }
  button, .signin-btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; text-decoration:none; text-align:center; }
  button.secondary { background:var(--panel); border:1px solid var(--border); }
  input, textarea { background:#0c0e12; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:14px; font-family:inherit; }
  .screen { display:none; height:100%; }
  .screen.active { display:flex; }
  #login { align-items:center; justify-content:center; }
  #login .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:28px; width:340px; }
  #login h1 { font-size:18px; margin:0 0 4px; }
  #login p { color:var(--muted); margin:0 0 16px; }
  #main { flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border); background:var(--panel); }
  header .name { font-weight:600; }
  header .meta { color:var(--muted); font-size:13px; flex:1; }
  #body { display:flex; flex:1; min-height:0; }
  #sidebar { width:280px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--panel); }
  #sidebar .actions { padding:12px; display:flex; gap:8px; }
  #sessions { overflow-y:auto; flex:1; }
  .session { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .session:hover { background:#1d212b; }
  .session .t { font-weight:500; }
  .session .m { color:var(--muted); font-size:12px; }
  #chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  #messages { flex:1; overflow-y:auto; padding:18px; }
  .msg { max-width:760px; margin:0 auto 14px; }
  .msg .role { font-size:12px; color:var(--muted); margin-bottom:3px; }
  .msg .bubble { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user .bubble { background:#20304f; border-color:#2c4470; }
  .msg .cost { font-size:12px; color:var(--muted); margin-top:4px; }
  #compose { display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--border); background:var(--panel); }
  #compose textarea { flex:1; resize:none; min-height:44px; }
  #notice { color:var(--muted); text-align:center; padding:18px; }
  .error { color:#ff6b6b; }
</style>
</head>
<body>
  <div id="login" class="screen">
    <div class="card">
      <h1>R Tutor</h1>
      <p>Class AI R tutor. Sign in with your college email to continue.</p>
      <a class="signin-btn" href="/auth/login">Sign in</a>
    </div>
  </div>

  <div id="main" class="screen">
    <header>
      <span class="name" id="meName"></span>
      <span class="meta" id="meMeta"></span>
      <button class="secondary" id="logout">Log out</button>
    </header>
    <div id="body">
      <div id="sidebar">
        <div class="actions">
          <button id="newSession">New conversation</button>
        </div>
        <div id="sessions"></div>
      </div>
      <div id="chat">
        <div id="messages"><div id="notice">Select a conversation, or start a new one.</div></div>
        <div id="compose">
          <textarea id="prompt" placeholder="Ask about R, paste some code…"></textarea>
          <button id="send">Send</button>
        </div>
      </div>
    </div>
  </div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const api = {
  async req(path, opts={}) {
    opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
    const r = await fetch(path, opts);
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  }
};

let currentSession = null;

function fmtUsd(v) { return "$" + (v||0).toFixed(4); }
function esc(s) {
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

function showMain(s) {
  $("#login").classList.remove("active");
  $("#main").classList.add("active");
  $("#meName").textContent = s.name;
}

async function refreshMe() {
  const me = await api.req("/api/me");
  $("#meMeta").textContent = "spent " + fmtUsd(me.spent_usd) +
    (me.budget_usd > 0 ? " of " + fmtUsd(me.budget_usd) : "");
}

async function loadSessions() {
  const list = await api.req("/api/me/sessions");
  $("#sessions").innerHTML = "";
  for (const s of list) {
    const el = document.createElement("div");
    el.className = "session";
    el.innerHTML = `<div class="t">${esc(s.title || "(untitled)")}</div>
      <div class="m">${fmtUsd(s.cost_usd)}</div>`;
    el.onclick = () => openSession(s.id);
    $("#sessions").appendChild(el);
  }
  return list;
}

async function openSession(id) {
  currentSession = id;
  const msgs = await api.req(`/api/me/sessions/${id}/messages`);
  $("#messages").innerHTML = "";
  if (!msgs.length) $("#messages").innerHTML = `<div id="notice">New conversation — ask away.</div>`;
  for (const m of msgs) {
    const el = document.createElement("div");
    el.className = "msg " + m.role;
    el.innerHTML = `<div class="role">${esc(m.role)}</div><div class="bubble">${esc(m.text)}</div>`;
    $("#messages").appendChild(el);
  }
  $("#messages").scrollTop = $("#messages").scrollHeight;
}

async function send() {
  const text = $("#prompt").value.trim();
  if (!text || !currentSession) return;
  $("#prompt").value = "";
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="role">you</div><div class="bubble">${esc(text)}</div>`;
  $("#messages").appendChild(el);
  const thinking = document.createElement("div");
  thinking.className = "msg assistant";
  thinking.innerHTML = `<div class="role">assistant</div><div class="bubble">…</div>`;
  $("#messages").appendChild(thinking);
  $("#messages").scrollTop = $("#messages").scrollHeight;

  try {
    const r = await api.req(`/api/me/sessions/${currentSession}/messages`, {
      method: "POST", body: JSON.stringify({ text })
    });
    thinking.innerHTML = `<div class="role">assistant</div><div class="bubble">${esc(r.assistant)}</div>
      <div class="cost">this turn: ${fmtUsd(r.cost_usd)} · total: ${fmtUsd(r.spent_usd)}</div>`;
    refreshMe(); loadSessions();
  } catch (e) {
    thinking.innerHTML = `<div class="role">assistant</div><div class="bubble error">${esc(e.message)}</div>`;
  }
  $("#messages").scrollTop = $("#messages").scrollHeight;
}

$("#logout").onclick = () => { location.href = "/logout"; };
$("#newSession").onclick = async () => {
  const r = await api.req("/api/me/sessions", { method: "POST", body: JSON.stringify({}) });
  openSession(r.id); loadSessions();
};
$("#send").onclick = send;
$("#prompt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

(async () => {
  try {
    const me = await api.req("/api/me");
    if (me.role === "admin") {
      $("#login").classList.remove("active");
      $("#main").classList.add("active");
      $("#meName").textContent = me.email;
      $("#meMeta").textContent = "instructor";
      $("#newSession").style.display = "none";
      $("#compose").style.display = "none";
      $("#sessions").innerHTML = `<div id="notice">Admin tools are coming soon. Manage students, budgets, and usage from the CLI for now.</div>`;
      return;
    }
    showMain({ name: me.name, spent_usd: me.spent_usd });
    refreshMe(); loadSessions();
  } catch (e) {
    $("#login").classList.add("active");
  }
})();
</script>
</body>
</html>
