<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R Tutor</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login" class="screen">
    <div class="card">
      <h1>R Tutor</h1>
      <p>Class AI R tutor. Sign in with your college email to continue.</p>
      <a class="signin-btn" href="/auth/login">Sign in</a>
    </div>
  </div>

  <div id="main" class="screen">
    <header>
      <span class="name" id="meName"></span>
      <span class="meta" id="meMeta"></span>
      <button class="secondary" id="logout">Log out</button>
    </header>
    <div id="restore"></div>
    <div id="scratch-note"></div>
    <div id="body">
      <div id="sidebar">
        <div class="actions">
          <button id="newSession">New conversation</button>
        </div>
        <div id="sessions"></div>
      </div>
      <div id="chat">
        <div id="messages"><div id="notice">Select a conversation, or start a new one.</div></div>
        <div id="compose">
          <textarea id="prompt" placeholder="Ask about R, paste some code…"></textarea>
          <button id="send">Send</button>
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { $, api, fmtUsd, esc, fillMessages } from "/js/api.js";

let currentSession = null;
let scratch = false;

function closeMenus() {
  document.querySelectorAll(".menu-pop").forEach(m => m.remove());
}
document.addEventListener("click", closeMenus);

function showMain(s) {
  $("#login").classList.remove("active");
  $("#main").classList.add("active");
  $("#meName").textContent = s.name;
}

async function refreshMe() {
  const me = await api.req("/api/me");
  $("#meMeta").textContent = "spent " + fmtUsd(me.spent_usd) +
    (me.budget_usd > 0 ? " of " + fmtUsd(me.budget_usd) : "");
}

async function renameSession(id) {
  const el = document.querySelector(`[data-sid="${id}"] .t`);
  const old = el.textContent;
  const input = document.createElement("input");
  input.value = old; input.style.flex = "1"; input.style.minWidth = "0";
  el.replaceWith(input);
  input.focus(); input.select();
  const commit = async (cancel) => {
    const title = input.value.trim();
    if (!cancel && title && title !== old) {
      await api.req(`/api/me/sessions/${id}`, { method: "PATCH", body: JSON.stringify({ title }) });
      loadSessions();
    } else {
      input.replaceWith(el);
    }
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") commit(false);
    else if (e.key === "Escape") commit(true);
  });
  input.addEventListener("blur", () => commit(false));
}

async function deleteSession(id) {
  if (!confirm("Hide this conversation? It will no longer appear in your list.")) return;
  await api.req(`/api/me/sessions/${id}`, { method: "DELETE" });
  loadSessions();
  if (currentSession === id) {
    currentSession = null;
    $("#messages").innerHTML = `<div id="notice">Select a conversation, or start a new one.</div>`;
  }
}

function sessionMenuBtn(id, ev) {
  ev.stopPropagation();
  closeMenus();
  const rect = ev.currentTarget.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "menu-pop";
  pop.style.left = rect.left + "px";
  pop.style.top = (rect.bottom + 4) + "px";
  const ren = document.createElement("button"); ren.textContent = "Rename"; ren.onclick = () => { closeMenus(); renameSession(id); };
  const del = document.createElement("button"); del.textContent = "Delete"; del.className = "danger"; del.onclick = () => { closeMenus(); deleteSession(id); };
  pop.append(ren, del);
  document.body.appendChild(pop);
}

async function loadSessions() {
  const list = await api.req("/api/me/sessions");
  $("#sessions").innerHTML = "";
  for (const s of list) {
    const el = document.createElement("div");
    el.className = "session";
    el.dataset.sid = s.id;
    el.innerHTML = `<div class="t">${esc(s.title || "(untitled)")}</div>
      <div class="m">${fmtUsd(s.cost_usd)}</div>
      <button class="menu-btn" title="More">⋯</button>`;
    el.onclick = () => openSession(s.id);
    el.querySelector(".menu-btn").onclick = (ev) => sessionMenuBtn(s.id, ev);
    $("#sessions").appendChild(el);
  }
  closeMenus();
  return list;
}

async function ensureSession() {
  if (currentSession) return currentSession;
  const r = await api.req("/api/me/sessions", { method: "POST", body: JSON.stringify({}) });
  currentSession = r.id;
  return currentSession;
}

async function openSession(id) {
  currentSession = id;
  $("#restore").style.display = "none";
  const msgs = await api.req(`/api/me/sessions/${id}/messages`);
  $("#messages").innerHTML = "";
  if (!msgs.length) $("#messages").innerHTML = `<div id="notice">This is the start of a conversation.</div>`;
  fillMessages($("#messages"), msgs);
  $("#messages").scrollTop = $("#messages").scrollHeight;
}

async function send() {
  const text = $("#prompt").value.trim();
  if (!text) return;
  $("#prompt").value = "";
  const sid = await ensureSession();
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="role">you</div><div class="bubble">${esc(text)}</div>`;
  $("#messages").appendChild(el);
  const thinking = document.createElement("div");
  thinking.className = "msg assistant";
  thinking.innerHTML = `<div class="role">assistant</div><div class="bubble">…</div>`;
  $("#messages").appendChild(thinking);
  $("#messages").scrollTop = $("#messages").scrollHeight;

  try {
    const r = await api.req(`/api/me/sessions/${sid}/messages`, {
      method: "POST", body: JSON.stringify({ text })
    });
    thinking.innerHTML = `<div class="role">assistant</div><div class="bubble">${r.html || esc(r.assistant)}</div>
      <div class="cost">this turn: ${fmtUsd(r.cost_usd)} · total: ${fmtUsd(r.spent_usd)}</div>`;
    refreshMe();
    loadSessions();
  } catch (e) {
    thinking.innerHTML = `<div class="role">assistant</div><div class="bubble error">${esc(e.message)}</div>`;
  }
  $("#messages").scrollTop = $("#messages").scrollHeight;
}

$("#logout").onclick = () => { location.href = "/logout"; };
$("#newSession").onclick = async () => {
  const r = await api.req("/api/me/sessions", { method: "POST", body: JSON.stringify({}) });
  openSession(r.id); loadSessions();
};
$("#send").onclick = send;
$("#prompt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

(async () => {
  try {
    const me = await api.req("/api/me");
    if (me.role === "admin") {
      // Instructors get a dedicated page, not the student shell.
      location.href = "/admin.html";
      return;
    }
    scratch = !!me.scratch;
    showMain({ name: me.name, spent_usd: me.spent_usd });
    if (scratch) {
      const note = $("#scratch-note");
      note.textContent = "Instructor test session — your spend won't affect any student.";
      note.style.display = "block";
    }
    refreshMe();
    loadSessions();
    const cur = await api.req("/api/me/sessions/current");
    await openSession(cur.id);
    if (cur.restored && !scratch) {
      const banner = $("#restore");
      banner.textContent = "Restored your last session. Click “New conversation” to start a new topic.";
      banner.style.display = "block";
    }
  } catch (e) {
    $("#login").classList.add("active");
  }
})();
</script>
</body>
</html>
