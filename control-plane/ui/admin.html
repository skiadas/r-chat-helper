<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R Tutor — Instructor</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="admin" class="screen active">
    <header>
      <span class="name" id="meName"></span>
      <span class="meta" id="meMeta"></span>
      <a class="signin-btn" href="/test-student">Test the student experience</a>
      <button class="secondary" id="logout">Log out</button>
    </header>
    <div class="tabbar">
      <button id="tabStudents" class="active">Students</button>
      <button id="tabSessions">Sessions</button>
    </div>
    <div class="layout">
      <section id="studentsPane" class="pane active">
        <form id="addStudent" class="row" autocomplete="off">
          <input id="newEmail" type="email" placeholder="email" required>
          <input id="newName" placeholder="name" required>
          <input id="newBudget" type="number" min="0.01" step="0.01" placeholder="budget $" required style="width:90px">
          <button type="submit">Add</button>
        </form>
        <div class="pane-head">
          <span>Students</span>
          <span class="grow"></span>
          <span class="usr" id="scratchSummary"></span>
        </div>
        <div class="scroller">
          <table class="data">
            <thead><tr><th>Name</th><th>Email</th><th class="num">Budget</th><th class="num">Spent</th><th>Status</th></tr></thead>
            <tbody id="students"></tbody>
          </table>
        </div>
      </section>
      <section id="sessionsPane" class="pane">
        <div class="pane-head">
          <button class="btn" id="drillBack" style="display:none">← Back to sessions</button>
          <span id="sessionsTitle">Sessions</span>
          <span class="grow"></span>
          <select id="sessionFilter"></select>
          <button class="secondary" id="refresh">Refresh</button>
        </div>
        <div class="scroller" id="sessionsList">
          <div id="notice">Select a session to view its messages.</div>
        </div>
      </section>
    </div>
  </div>

<script type="module">
import { $, api, fmtUsd, esc, fillMessages } from "/js/api.js";

let students = [];
let sessions = [];

function money1(v) { return "$" + (v || 0).toFixed(1); }

function meter(spent, budget) {
  if (!budget) return `<span class="meter-label" style="color:var(--red)">no budget</span>`;
  const frac = budget > 0 ? spent / budget : 0;
  const cls = frac >= 1 ? "over" : frac >= 0.8 ? "warn" : "";
  const w = Math.min(100, Math.round(frac * 100));
  return `<span class="meter-cell">
            <span class="meter" title="${fmtUsd(spent)} of ${fmtUsd(budget)}"><i class="${cls}" style="width:${w}%"></i></span>
            <span class="meter-label">${money1(spent)} / ${money1(budget)}</span>
          </span>`;
}

async function loadStudents() {
  const data = await api.req("/api/admin/students");
  students = data.students;
  const tbody = $("#students");
  tbody.innerHTML = "";
  for (const s of students) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><button class="btn" data-link data-id="${esc(s.id)}">${esc(s.name)}</button>
        ${s.test ? `<span class="tag draft">test</span>` : ""}</td>
      <td class="usr">${esc(s.email)}</td>
      <td class="num budget" data-id="${esc(s.id)}" title="Click to edit budget" style="cursor:pointer">${meter(s.spent_usd, s.budget_usd)}</td>
      <td class="num">${fmtUsd(s.spent_usd)}</td>
      <td><button class="secondary" data-act data-id="${esc(s.id)}">${s.active ? "Deactivate" : "Activate"}</button></td>`;
    tr.querySelector("[data-link]").onclick = () => filterByStudent(s.id);
    tr.querySelector("[data-act]").onclick = async () => {
      await api.req(`/api/admin/students/${encodeURIComponent(s.id)}`, {
        method: "PATCH", body: JSON.stringify({ active: !s.active })
      });
      loadStudents();
    };
    tr.querySelector(".budget").onclick = async () => {
      const v = prompt("Budget (USD):", s.budget_usd);
      if (v === null || v === "") return;
      await api.req(`/api/admin/students/${encodeURIComponent(s.id)}`, {
        method: "PATCH", body: JSON.stringify({ budget_usd: parseFloat(v) })
      });
      loadStudents();
    };
    tbody.appendChild(tr);
  }
  populateFilter();
}

function populateFilter() {
  const sel = $("#sessionFilter");
  sel.innerHTML = `<option value="">All students</option>` +
    students.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
  sel.value = "";
}

function sessionRows(list) {
  const table = document.createElement("table");
  table.className = "data";
  table.innerHTML = `<thead><tr><th>Student</th><th>Title</th><th>Status</th><th>Updated</th></tr></thead>`;
  const tbody = document.createElement("tbody");
  for (const s of list) {
    const tr = document.createElement("tr");
    tr.className = s.deleted ? "strike" : "clickable";
    const d = new Date(s.updated * 1000);
    tr.innerHTML = `
      <td>${esc(s.student_name)}<div class="usr">${esc(s.student_email)}</div></td>
      <td>${esc(s.title || "(untitled)")}</td>
      <td>${tagFor(s)}</td>
      <td class="usr">${d.toLocaleDateString()} ${d.toLocaleTimeString()}</td>`;
    tr.onclick = () => openSession(s.id);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function tagFor(s) {
  if (s.deleted) return `<span class="tag deleted">deleted</span>`;
  if (!s.committed) return `<span class="tag draft">draft</span>`;
  return "";
}

async function loadSessions() {
  sessions = await api.req("/api/admin/sessions");
  renderSessions();
}

function renderSessions() {
  const box = $("#sessionsList");
  box.innerHTML = "";
  const filter = $("#sessionFilter").value;
  const list = filter ? sessions.filter(s => s.student_id === filter) : sessions;
  if (!list.length) {
    box.innerHTML = `<div id="notice">No sessions${filter ? " for this student" : ""}.</div>`;
    return;
  }
  box.appendChild(sessionRows(list));
}

function filterByStudent(id) {
  $("#sessionFilter").value = id;
  showTab("sessions");   // exitDrill() inside renders with the new filter
}

async function openSession(sid) {
  const ses = sessions.find(x => x.id === sid) || { title: "(deleted)" };
  const msgs = await api.req(`/api/admin/sessions/${sid}/messages`);
  $("#sessionsTitle").textContent = `${ses.student_name} — ${ses.title || "(untitled)"}`;
  $("#drillBack").style.display = "";
  $("#sessionFilter").style.display = "none";
  $("#refresh").style.display = "none";
  const box = $("#sessionsList");
  box.innerHTML = "";
  if (!msgs.length) {
    box.innerHTML = `<div id="notice">No messages.</div>`;
    return;
  }
  fillMessages(box, msgs);
}

function exitDrill() {
  $("#drillBack").style.display = "none";
  $("#sessionFilter").style.display = "";
  $("#refresh").style.display = "";
  $("#sessionsTitle").textContent = "Sessions";
  renderSessions();
}

function showTab(name) {
  $("#studentsPane").classList.toggle("active", name === "students");
  $("#sessionsPane").classList.toggle("active", name === "sessions");
  $("#tabStudents").classList.toggle("active", name === "students");
  $("#tabSessions").classList.toggle("active", name === "sessions");
  if (name === "sessions") exitDrill();
}

$("#logout").onclick = () => { location.href = "/logout"; };
$("#tabStudents").onclick = () => showTab("students");
$("#tabSessions").onclick = () => showTab("sessions");
$("#drillBack").onclick = exitDrill;
$("#refresh").onclick = loadSessions;
$("#sessionFilter").onchange = renderSessions;

$("#addStudent").onsubmit = async (e) => {
  e.preventDefault();
  const budget = parseFloat($("#newBudget").value);
  await api.req("/api/admin/students", {
    method: "POST", body: JSON.stringify({
      email: $("#newEmail").value.trim(),
      name: $("#newName").value.trim(),
      budget_usd: budget
    })
  });
  e.target.reset();
  loadStudents();
};

(async () => {
  try {
    const me = await api.req("/api/me");
    window.__rcAuthed = true;
    if (me.role !== "admin") { location.href = "/"; return; }
    $("#meName").textContent = me.email;
  } catch (e) {
    location.href = "/";
    return;
  }
  loadStudents();
  loadSessions();
  setInterval(loadSessions, 30000);
})();
</script>
</body>
</html>
