# r-chat-helper control plane + Caddy TLS.
# Copy .env.example to .env on the server and fill in real values.
# DOMAIN and GHCR_OWNER are read by this file (not the app); all RC_* variables
# pass through to the app container.

services:
  app:
    image: ghcr.io/${GHCR_OWNER}/r-chat-helper:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config: